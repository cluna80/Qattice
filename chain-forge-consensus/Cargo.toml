[package]
name    = "chain-forge-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chain-forge-core   = { path = "../chain-forge-core" }
chain-forge-crypto = { path = "../chain-forge-crypto", optional = true }
chain-forge-vca-pq = { path = "../chain-forge-vca-pq" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
sha3        = { workspace = true, optional = true }
crc32fast   = { version = "1", optional = true }

[features]
real-crypto = ["dep:chain-forge-crypto", "chain-forge-crypto/real-crypto", "chain-forge-crypto/real-pqc"]
# PQ-HotStuff-2 (docs/pq-hotstuff-001-spec.md). Phase 0: not in any default feature set; no network activates it.
pq-hotstuff = ["dep:sha3"]
# The real FIPS 204 ML-DSA-65 adapter for the safety-state signer/verifier traits (in-memory keys only; off by default).
# Uses the fips204-backend feature of chain-forge-crypto; compatible with real-crypto in the same build.
pq-hotstuff-fips204 = ["pq-hotstuff", "dep:chain-forge-crypto", "chain-forge-crypto/fips204-backend"]
# Gate B devnet test harness (QAT-07). Two OS processes, loopback TCP, real ML-DSA-65, file-based counter.
# DISABLED by default. Enable only for the Windows acceptance test run. Epoch-transition activation is a separate decision.
gate-b-harness = ["pq-hotstuff-fips204", "dep:crc32fast"]
# Authenticated epoch-transition handoff: ML-DSA-65 verification of the outgoing-set
# signatures in CommitCertificate, canonical set_hash with public keys, and consecutive-
# round parent-link check. Disabled until PQ-HotStuff-2 passes its Phase 2 gate on Windows.
epoch-transition = ["pq-hotstuff-fips204"]

[dev-dependencies]
tokio = { workspace = true }
