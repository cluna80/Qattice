[package]
name    = "chain-forge-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
chain-forge-core   = { path = "../chain-forge-core" }
chain-forge-crypto = { path = "../chain-forge-crypto", features = ["real-crypto"], optional = true }
chain-forge-vca-pq = { path = "../chain-forge-vca-pq" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
tracing     = { workspace = true }
sha3        = { workspace = true, optional = true }

[features]
real-crypto = ["chain-forge-crypto", "chain-forge-crypto/real-pqc"]
# PQ-HotStuff-2 (docs/pq-hotstuff-001-spec.md). Phase 0: not in any default feature set; no network activates it.
pq-hotstuff = ["dep:sha3"]
# The real FIPS 204 ML-DSA-65 adapter for the safety-state signer/verifier traits (in-memory keys only; off by default).
# (enables ONLY chain-forge-crypto's fips204-backend; the Ed25519 `real-crypto` feature stays tied to the `real-crypto` feature)
pq-hotstuff-fips204 = ["pq-hotstuff", "chain-forge-crypto/fips204-backend"]

[dev-dependencies]
tokio = { workspace = true }
